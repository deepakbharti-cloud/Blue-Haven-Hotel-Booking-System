<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Booking flow">
<defs><linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#34d399"/></linearGradient>
<filter id="g" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>
.dash{stroke-dasharray:10 10;animation:dm 1.2s linear infinite}
@keyframes dm{to{stroke-dashoffset:-20}}
.pr{animation:pr 8s ease-out infinite;transform-box:fill-box;transform-origin:center;opacity:0}
@keyframes pr{0%{transform:scale(1);opacity:.9}14%{transform:scale(1.8);opacity:0}100%{transform:scale(1.8);opacity:0}}
</style>
<rect x="0" y="0" width="1200" height="250" rx="20" fill="#071226"/>
<line x1="110" y1="120" x2="1090" y2="120" stroke="url(#ln)" stroke-width="4" class="dash" stroke-linecap="round"/>
<g><circle cx="110" cy="120" r="30" fill="none" stroke="#38bdf8" stroke-width="2" class="pr" style="animation-delay:0.0s"/>
<circle cx="110" cy="120" r="30" fill="#0b1a36" stroke="#38bdf8" stroke-width="2.5"/>
<text x="110" y="128" text-anchor="middle" font-size="22" font-weight="800" fill="#38bdf8" font-family="'Segoe UI',Helvetica,Arial,sans-serif">1</text>
<text x="110" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#f0f9ff" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Browse</text>
<text x="110" y="204" text-anchor="middle" font-size="13.5" fill="#93c5fd" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Explore rooms</text></g><g><circle cx="306" cy="120" r="30" fill="none" stroke="#22d3ee" stroke-width="2" class="pr" style="animation-delay:1.6s"/>
<circle cx="306" cy="120" r="30" fill="#0b1a36" stroke="#22d3ee" stroke-width="2.5"/>
<text x="306" y="128" text-anchor="middle" font-size="22" font-weight="800" fill="#22d3ee" font-family="'Segoe UI',Helvetica,Arial,sans-serif">2</text>
<text x="306" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#f0f9ff" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Sign in</text>
<text x="306" y="204" text-anchor="middle" font-size="13.5" fill="#93c5fd" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Register / login</text></g><g><circle cx="502" cy="120" r="30" fill="none" stroke="#a78bfa" stroke-width="2" class="pr" style="animation-delay:3.2s"/>
<circle cx="502" cy="120" r="30" fill="#0b1a36" stroke="#a78bfa" stroke-width="2.5"/>
<text x="502" y="128" text-anchor="middle" font-size="22" font-weight="800" fill="#a78bfa" font-family="'Segoe UI',Helvetica,Arial,sans-serif">3</text>
<text x="502" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#f0f9ff" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Pick dates</text>
<text x="502" y="204" text-anchor="middle" font-size="13.5" fill="#93c5fd" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Guests &amp; dates</text></g><g><circle cx="698" cy="120" r="30" fill="none" stroke="#fbbf24" stroke-width="2" class="pr" style="animation-delay:4.8s"/>
<circle cx="698" cy="120" r="30" fill="#0b1a36" stroke="#fbbf24" stroke-width="2.5"/>
<text x="698" y="128" text-anchor="middle" font-size="22" font-weight="800" fill="#fbbf24" font-family="'Segoe UI',Helvetica,Arial,sans-serif">4</text>
<text x="698" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#f0f9ff" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Validate</text>
<text x="698" y="204" text-anchor="middle" font-size="13.5" fill="#93c5fd" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Capacity + overlap</text></g><g><circle cx="894" cy="120" r="30" fill="none" stroke="#fb7185" stroke-width="2" class="pr" style="animation-delay:6.4s"/>
<circle cx="894" cy="120" r="30" fill="#0b1a36" stroke="#fb7185" stroke-width="2.5"/>
<text x="894" y="128" text-anchor="middle" font-size="22" font-weight="800" fill="#fb7185" font-family="'Segoe UI',Helvetica,Arial,sans-serif">5</text>
<text x="894" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#f0f9ff" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Pay</text>
<text x="894" y="204" text-anchor="middle" font-size="13.5" fill="#93c5fd" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Razorpay / demo</text></g><g><circle cx="1090" cy="120" r="30" fill="none" stroke="#34d399" stroke-width="2" class="pr" style="animation-delay:8.0s"/>
<circle cx="1090" cy="120" r="30" fill="#0b1a36" stroke="#34d399" stroke-width="2.5"/>
<text x="1090" y="128" text-anchor="middle" font-size="22" font-weight="800" fill="#34d399" font-family="'Segoe UI',Helvetica,Arial,sans-serif">6</text>
<text x="1090" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#f0f9ff" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Confirmed</text>
<text x="1090" y="204" text-anchor="middle" font-size="13.5" fill="#93c5fd" font-family="'Segoe UI',Helvetica,Arial,sans-serif">See My Bookings</text></g>
<circle r="9" fill="#fff" filter="url(#g)"><animateMotion dur="8s" repeatCount="indefinite" path="M110 120 H1090"/></circle>
<text x="600" y="38" text-anchor="middle" font-size="16" letter-spacing="5" fill="#7dd3fc" font-family="'Segoe UI',Helvetica,Arial,sans-serif">HOW A BOOKING WORKS</text>
</svg>

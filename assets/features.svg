<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="Feature overview">
<style>
.cin{opacity:0;animation:up .7s ease-out forwards}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.ring{stroke-dasharray:164;stroke-dashoffset:164;animation:draw 1.4s ease-out forwards,spin 8s linear infinite 2s;transform-box:fill-box;transform-origin:center}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{animation:bar 3.5s ease-in-out infinite;transform-box:fill-box;transform-origin:left}
@keyframes bar{0%,100%{opacity:.35}50%{opacity:1}}
</style>
<g class="card" style="animation-delay:0.0s" transform="translate(30,30)">
<g class="cin" style="animation-delay:0.0s">
<rect width="360" height="135" rx="18" fill="#0b1a36" stroke="#38bdf8" stroke-opacity=".45"/>
<rect x="0" y="0" width="360" height="5" rx="2.5" fill="#38bdf8" class="bar" style="animation-delay:0.0s"/>
<circle cx="52" cy="52" r="26" fill="#38bdf8" fill-opacity=".15"/>
<circle cx="52" cy="52" r="26" fill="none" stroke="#38bdf8" stroke-width="2" class="ring" style="animation-delay:0.0s"/>
<text x="52" y="59" text-anchor="middle" font-size="20" font-weight="800" fill="#38bdf8" font-family="'Segoe UI',Helvetica,Arial,sans-serif">01</text>
<text x="96" y="46" font-size="20" font-weight="700" fill="#f0f9ff" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Responsive homepage</text>
<text x="96" y="72" font-size="14" fill="#93c5fd" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Room catalogue that looks great on</text>
<text x="96" y="92" font-size="14" fill="#93c5fd" font-family="'Segoe UI',Helvetica,Arial,sans-serif">phone, tablet and desktop.</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Footer">
<defs><linearGradient id="f" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b2a5b"/><stop offset="1" stop-color="#0c6fb8"/></linearGradient></defs>
<style>
.fw1{animation:s 12s linear infinite}.fw2{animation:s 8s linear infinite reverse}
@keyframes s{to{transform:translateX(-1200px)}}
.ft{animation:p 3.5s ease-in-out infinite}@keyframes p{0%,100%{opacity:.8}50%{opacity:1}}
</style>
<rect width="1200" height="150" fill="url(#f)"/>
<g transform="translate(0,20)"><path class="fw1" d="M0 40 Q150 0 300 40 T600 40 T900 40 T1200 40 T1500 40 T1800 40 T2100 40 T2400 40 V140 H0 Z" fill="#0ea5e9" fill-opacity=".35"/></g>
<g transform="translate(0,48)"><path class="fw2" d="M0 40 Q150 0 300 40 T600 40 T900 40 T1200 40 T1500 40 T1800 40 T2100 40 T2400 40 V140 H0 Z" fill="#050d1f" fill-opacity=".55"/></g>
<text x="600" y="100" text-anchor="middle" font-size="22" font-weight="700" fill="#fff" class="ft" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Built with Django by Deepak Bharti</text>
<text x="600" y="128" text-anchor="middle" font-size="14" fill="#bae6fd" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Thanks for visiting Blue Haven - a star is always appreciated</text>
</svg>

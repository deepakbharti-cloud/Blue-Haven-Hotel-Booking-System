<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Blue Haven Hotel Booking System banner">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050d1f"/><stop offset=".55" stop-color="#0b2a5b"/><stop offset="1" stop-color="#0c6fb8"/></linearGradient>
<linearGradient id="ti" x1="0" x2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#7dd3fc"/></linearGradient>
<linearGradient id="tail" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="rc"><rect width="1200" height="340" rx="22"/></clipPath>
</defs>
<style>
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:1}}
.lit{animation:lit 6s ease-in-out infinite}
@keyframes lit{0%,100%{opacity:1}45%{opacity:1}55%{opacity:.15}70%{opacity:.15}80%{opacity:1}}
.rise{animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.pill{animation:rise .8s ease-out both}
.w1{animation:slide 14s linear infinite}
.w2{animation:slide 9s linear infinite reverse}
@keyframes slide{to{transform:translateX(-1200px)}}
.moon{animation:pulse 4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.85}50%{opacity:1}}
.sign{animation:neon 2.6s ease-in-out infinite}
@keyframes neon{0%,100%{opacity:1}48%{opacity:1}50%{opacity:.35}52%{opacity:1}}
.shoot{animation:shoot 7s ease-in infinite 2s}
@keyframes shoot{0%{transform:translate(0,0);opacity:0}3%{opacity:1}14%{transform:translate(-300px,150px);opacity:0}100%{transform:translate(-300px,150px);opacity:0}}
.float{animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.ph{opacity:0;animation:ph 9s infinite}
.ph2{animation-delay:3s}.ph3{animation-delay:6s}
@keyframes ph{0%{opacity:0;transform:translateY(8px)}4%,30%{opacity:1;transform:none}34%,100%{opacity:0;transform:translateY(-8px)}}
</style>
